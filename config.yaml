# ===================== Job Watcher settings =====================

# How often to check when running with --loop
check_every_minutes: 60

# Job titles / words to look for on EVERY company's page (not case-sensitive)
keywords:
  - analyst
  - software developer
  - IT
  - engineer
  - developer
  - .net

# Skip anything containing these words
exclude:
  - intern

# Companies to watch. Replace these examples with your own.
#   name: label shown in alerts
#   url:  the page that LISTS the jobs (not the homepage)
#   js:   set to true if the jobs don't show up (page loads them with JavaScript)
#   keywords: optional extra keywords just for this company
companies:
  - name: JMMB
    url: https://jm.jmmb.com/careers-page
    js: false

  - name: Intellibus
    url: https://www.intellibus.com/jobs
    js: true
    
  - name: CIBC
    url: https://www.candidatemanager.net/cm/p/pJobs.aspx?mid=YFYU&sid=BBYGT&jl=Jamaica
    js: false

  - name: VMBS
    url: https://www.candidatemanager.net/cm/p/pJobs.aspx?mid=CXAZUF&sid=YDDB
    js: false

  - name: GraceKennedy
    url: https://careers.gracekennedy.com/search/?createNewAlert=false&q=&locationsearch=jamaica&optionsFacetsDD_dept=&optionsFacetsDD_customfield1=
    js: false

  - name: JN
    url: https://jngroup.zohorecruit.com/jobs/careers
    js: false

  - name: Digicel
    url: https://careers.digicelgroup.com/search/?createNewAlert=false&q=&locationsearch=jamaica&optionsFacetsDD_country=&optionsFacetsDD_customfield1=
    js: false

  - name: NCB
    url: https://www.caribbeanjobs.com/NCB-Financial-Group-Jobs-46.aspx
    js: false

  - name: SeProd
    url: https://www.seprod.com/careers/
    js: false

  - name: Barita
    url: https://www.barita.com/about-us/careers/
    js: false

  - name: JamIcta
    url: https://icta.gov.jm/work-with-us/jobs/
    js: false

  - name: JCA
    url: https://jca.gov.jm/about-us/careers/
    js: false

  - name: NHT
    url: https://www.nht.gov.jm/careers
    js: false

  - name: Sagicor
    url: https://career4.successfactors.com/career?company=sagicorfinP2&career%5fns=job%5flisting%5fsummary&navBarLevel=JOB%5fSEARCH&_s.crb=GTOHON%2f8avBuEU79PqDjbcU394IeAzqtxwiXZeNTi58%3d
    js: false

# ===================== Alerts =====================
# On GitHub Actions, DON'T put these here (the repo is public).
# Add them as repository secrets instead: NTFY_TOPIC, EMAIL_FROM,
# EMAIL_TO, EMAIL_PASSWORD. See README.md.
# The settings below are only for running on your own computer.
alerts:
  ntfy_topic: ""
  email:
    enabled: false
    from: you@gmail.com
    to: you@gmail.com
    password: ""
    smtp_server: smtp.gmail.com
    smtp_port: 587

name: Job Watcher

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at 7 minutes past (times are UTC)
  workflow_dispatch:       # adds a "Run workflow" button for testing

permissions:
  contents: write          # lets the job save seen_jobs.json back to the repo

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Only install the browser if a site in config.yaml needs it (js: true)
          if grep -Eq '^\s*js:\s*true' config.yaml; then
            pip install playwright
            playwright install --with-deps chromium
          fi

      - name: Check career pages
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python job_watcher.py

      - name: Save list of jobs already reported
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "job-watcher-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)